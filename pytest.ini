[pytest]
testpaths = tests
python_files = test_*.py

# Offline by default. Every test that needs the network, an accelerator, or real
# model weights must opt in through a marker below and is deselected here.
addopts =
    --strict-markers
    -m "not stack_compatibility and not cuda and not mps and not model_download"

markers =
    stack_compatibility: resolves real Diffusers/Transformers releases; needs network. Opt in with -m stack_compatibility.
    cuda: requires a CUDA accelerator. Opt in with -m cuda.
    mps: requires an Apple MPS accelerator. Opt in with -m mps.
    model_download: downloads real model weights; needs network and large disk. Opt in with -m model_download.
